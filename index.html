<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versi Rentan - Tugas KSI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Versi Rentan (Vulnerable)</h1>
        <p>Masukkan API Key Anda (disimpan di sessionStorage):</p>
        <input type="password" id="apiKeyInput" placeholder="Masukkan API Key Gemini..." />
        
        <p>Masukkan Prompt Anda:</p>
        <textarea id="promptInput" rows="4" placeholder="Tanyakan sesuatu..."></textarea>
        
        <button id="submitBtn">Kirim ke AI</button>

        <h3>Hasil (Output):</h3>
        <!-- Sengaja menggunakan innerHTML untuk celah XSS -->
        <div id="outputArea"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
